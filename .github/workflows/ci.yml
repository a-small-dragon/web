name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install
        run: npm install --legacy-peer-deps
      - name: lint
        run: npm run lint --if-present
      - name: build
        run: npm run build
        env:
          NODE_ENV: production
